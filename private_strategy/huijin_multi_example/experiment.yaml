# 本实验仅运行七只 ETF 的 Rule 策略；所有策略参数都在同目录 rule.py 中维护。
# 数据库、数据快照、费用、滑点、日历和 D+1 执行规则统一来自系统配置。
name: huijin_multi_etf_mvp
start_date: 2020-01-01
