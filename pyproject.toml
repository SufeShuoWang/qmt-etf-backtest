[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-backtest"
version = "0.2.0"
description = "QMT MySQL daily-close backtester for domestic stock and gold ETFs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Pydantic>=2.10,<3",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL>=1.1,<2",
    "numpy>=2.0,<3",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.9,<4",
    "PyYAML>=6,<7",
]

[project.scripts]
qmt-etf-backtest = "etf_backtest.cli:main"

[project.optional-dependencies]
deep = [
    "torch>=2.5,<3",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["etf_backtest*"]
exclude = ["database*", "example*", "tests*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "artifacts",
    "docs",
    "CODEX_EXECUTE_PROMPT.md",
    "CODEX_PLAN_PROMPT.md",
    "CODEX_TASK.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["etf_backtest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
show_error_codes = true
show_error_context = true
pretty = true
warn_unreachable = true
exclude = "(^|[\\\\/])(\\.venv|build|dist|artifacts)([\\\\/]|$)"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "unit: isolated unit tests",
    "integration: integration tests without an external MySQL requirement",
    "mysql: tests requiring the disposable MySQL test database",
    "e2e: end-to-end framework tests",
    "slow: tests that are intentionally slower than the default suite",
]

[tool.coverage.run]
branch = true
source = ["etf_backtest"]

[tool.coverage.report]
show_missing = true
skip_covered = true
