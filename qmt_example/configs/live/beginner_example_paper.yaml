config_version: "4.0"
account:
  mode: "PAPER"
  system_path: "qmt_example/configs/system.yaml"
  account_id_env: "QMT_PAPER_ACCOUNT_ID"
  account_type: "STOCK"
strategy:
  strategy_id: "beginner_rule"
  case: "rule"
  experiment_path: "private_strategy/beginner_example/experiment.yaml"
  initial_capital: "1000000"
  schedule_anchor_date: 2021-01-04
miniqmt:
  userdata_path: "C:/path/to/your/miniqmt/userdata_mini"
  session_id: 100001
  reconnect_interval_seconds: 5
signal: {run_time: "20:40:00"}
execution:
  policy: "NEAR_CLOSE_LIMIT"
  submit_start: "14:50:00"
  sell_phase_deadline: "14:53:00"
  stop_new_orders: "14:56:00"
  cancel_open_orders: "14:57:00"
  cancel_confirm_timeout_seconds: 60
  price_offset_ticks: 2
  quote_stale_seconds: 5
  lot_size: 100
  order_type: "FIX_PRICE"
eod: {run_time: "20:30:00"}
state_database:
  host: "127.0.0.1"
  port: 3306
  database: "qmt_etf_live_state"
  user: "qmt_live_user"
  password_env: "QMT_LIVE_MYSQL_PASSWORD"
risk:
  max_single_order_notional: "200000"
  max_daily_order_notional: "500000"
  min_order_notional: "100"
  max_total_target_weight: "1.0"
